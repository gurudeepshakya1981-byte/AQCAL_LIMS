<!DOCTYPE html>
<html>
<head>
    <title>AQCAL LIMS - Automated Certificate</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #003366; text-align: center; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #333; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 60px; font-family: monospace; }
        button { width: 100%; padding: 12px; margin-top: 25px; background-color: #0055A4; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold;}
        button:hover { background-color: #003366; }
        .dynamic-input-group { background: #eef2f5; padding: 15px; border-radius: 6px; margin-top: 15px; border-left: 4px solid #0055A4;}
    </style>
</head>
<body>
    <div class="container">
        <h1>AQCAL LIMS</h1>
        <p style="text-align: center; color: grey;">Automated Calibration & PDF Generator</p>
        
        <label>Select Calibration Type</label>
        <select id="template_select" onchange="updateForm()">
            {% for t in templates %}
                <option value="{{ t.id }}">{{ t.name }}</option>
            {% endfor %}
        </select>

        <label>Nominal Value (Unit depends on selection)</label>
        <input type="number" id="nominal" step="0.01" value="50">
        
        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label>Master Readings (Standard)</label>
                <textarea id="readings_master">50.206, 50.208, 50.205, 50.209, 50.207, 50.211, 50.213, 50.216, 50.212, 50.210</textarea>
            </div>
            <div style="flex: 1;">
                <label>Test Readings (UUC)</label>
                <textarea id="readings_test">50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0</textarea>
            </div>
        </div>

        <!-- Dynamic form fields will be injected here -->
        <div id="dynamic_fields_container" class="dynamic-input-group">
            <h4 style="margin-top:0;">Environment & Reference Parameters</h4>
            <div id="dynamic_fields"></div>
        </div>
        
        <button onclick="calculate()">Calculate & Download PDF Certificate</button>
    </div>

    <script>
        // Embed templates data from backend
        const templatesData = {{ templates_json | safe }};

        function updateForm() {
            const templateId = parseInt(document.getElementById('template_select').value);
            const template = templatesData.find(t => t.id === templateId);
            
            const container = document.getElementById('dynamic_fields');
            container.innerHTML = ''; // Clear old fields

            if (!template || !template.schema) return;

            // Generate input fields based on schema
            template.schema.forEach(field => {
                const label = document.createElement('label');
                label.innerText = field.label;
                
                const input = document.createElement('input');
                input.type = 'number';
                input.step = '0.0001';
                input.id = `var_${field.key}`;
                input.value = field.default;
                input.style.marginBottom = '10px';

                container.appendChild(label);
                container.appendChild(input);
            });
        }

        async function calculate() {
            const templateId = parseInt(document.getElementById('template_select').value);
            const template = templatesData.find(t => t.id === templateId);
            const nominal = parseFloat(document.getElementById('nominal').value);
            
            const masterArray = document.getElementById('readings_master').value.split(',').map(n => parseFloat(n.trim())).filter(n => !isNaN(n));
            const testArray = document.getElementById('readings_test').value.split(',').map(n => parseFloat(n.trim())).filter(n => !isNaN(n));
            
            // Collect dynamic inputs
            let variables = {};
            if (template && template.schema) {
                template.schema.forEach(field => {
                    variables[field.key] = parseFloat(document.getElementById(`var_${field.key}`).value);
                });
            }

            // Show loading state
            const btn = document.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = "Generating PDF...";
            btn.disabled = true;

            try {
                const response = await fetch('/calculate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        template_id: templateId, 
                        nominal_value: nominal, 
                        readings_master: masterArray,
                        readings_test: testArray,
                        variables: variables
                    })
                });

                if (!response.ok) {
                    const err = await response.json();
                    alert("Error: " + (err.error || "Unknown error"));
                    return;
                }

                // Handle PDF download
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `AQCAL_Certificate_${template.name.replace(/\s+/g, '_')}.pdf`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                
            } catch (e) {
                alert("Network error occurred.");
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        // Initialize form on page load
        window.onload = updateForm;
    </script>
</body>
</html>
