<!DOCTYPE html>
<html>
<head>
    <title>AQCAL LIMS - Uncertainty Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #003366; text-align: center; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 25px; background-color: #0055A4; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #003366; }
        #result { margin-top: 20px; padding: 15px; background-color: #e8f5e9; border-left: 5px solid #4caf50; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AQCAL LIMS</h1>
        <p style="text-align: center;">10 MΩ Calibration Calculator</p>
        
        <label>Uncertainty 1 (Master Cert)</label>
        <input type="number" id="u1" step="0.00001" value="0.00025">
        
        <label>Uncertainty 2 (Master Accuracy)</label>
        <input type="number" id="u2" step="0.00001" value="0.003464">
        
        <label>Uncertainty 3 (Resolution)</label>
        <input type="number" id="u3" step="0.00001" value="0.00000288">
        
        <label>Uncertainty 4 (Repeatability)</label>
        <input type="number" id="u4" step="0.00001" value="0.0000066">
        
        <button onclick="calculate()">Calculate & Save to Database</button>

        <div id="result">
            <h3>Calculation Complete!</h3>
            <p><strong>Combined Uncertainty (uc):</strong> <span id="uc_val"></span></p>
            <p><strong>Expanded Uncertainty (U):</strong> <span id="U_val"></span></p>
            <p style="color: green; font-size: 14px;"><em>Data successfully saved to Neon Database.</em></p>
        </div>
    </div>

    <script>
        async function calculate() {
            const u1 = parseFloat(document.getElementById('u1').value);
            const u2 = parseFloat(document.getElementById('u2').value);
            const u3 = parseFloat(document.getElementById('u3').value);
            const u4 = parseFloat(document.getElementById('u4').value);

            const response = await fetch('/calculate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ u1: u1, u2: u2, u3: u3, u4: u4 })
            });

            const data = await response.json();
            
            if (data.error) {
                alert("Error: " + data.error);
                return;
            }

            document.getElementById('uc_val').innerText = data.combined_uncertainty.toFixed(6);
            document.getElementById('U_val').innerText = data.expanded_uncertainty.toFixed(6);
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
